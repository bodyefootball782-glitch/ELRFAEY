<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | الرفاعي</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../css/auth.css"></head><body><div class="auth-math-bg" aria-hidden="true"><span>π</span><span>√</span><span>∑</span><span>x²</span><span>÷</span><span>∞</span><span>Δ</span><span>∫</span><span>≠</span><span>+</span><span>y=mx+b</span><span>∴</span></div><main class="auth-wrap"><section class="auth-card wide"><a class="auth-brand" href="../index.html">الرفــــاعي<small>IBRAHIM ELRFAEY</small></a><span class="auth-icon">✨</span><h1>سجل حسابك</h1><p>اكتب بياناتك واحفظ كلمة السر لأنها هتستخدمها كل مرة.</p><form id="registerForm"><div class="form-grid"><label>الاسم الرباعي<input id="fullName" required placeholder="الاسم بالكامل"></label><label>رقم الهاتف<input id="phone" required inputmode="tel" placeholder="01xxxxxxxxx"></label><label>المرحلة<select id="stage" required><option value="">اختار المرحلة</option><option>ابتدائية</option><option>إعدادية</option><option>ثانوية</option></select></label><label>الصف<select id="grade" required disabled><option value="">اختار الصف</option></select></label><label class="full">كلمة السر<input id="password" type="password" minlength="8" required placeholder="8 أحرف على الأقل"></label></div><div class="rules">🔒 كلمة السر: 8 أحرف على الأقل + حرف كبير + حرف صغير + رقم + رمز مثل ! @ # $</div><button class="btn btn-primary" type="submit">إنشاء الحساب <i class="fa-solid fa-arrow-left"></i></button><div id="authMsg" class="msg"></div><div id="otpBox" class="otp-box" hidden><label>كود التحقق<input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="اكتب الكود المرسل لك"></label><button id="verifyOtp" class="btn btn-verify" type="button">تأكيد الحساب</button></div></form><div class="auth-links"><span>عندك حساب؟</span><a href="login.html">دخول</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script></body></html>
